name: Apply checked font-only UI changes
on:
  push:
    branches: [feat/brand-gensen-rounded-tw]
    paths: ['.github/workflows/apply-gensen-ui-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brand-gensen-rounded-tw
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact-hash text edits only
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const plan=JSON.parse(readFileSync('scripts/gensen-ui-edits.json','utf8'));
          const hash=s=>createHash('sha256').update(s).digest('hex');
          for(const item of plan){
            assert.match(item.path,/^(src|tests|scripts)\/[\w./-]+$/);
            assert.ok(!item.path.includes('..'));
            const source=readFileSync(item.path,'utf8');
            assert.equal(hash(source),item.before,item.path);
            const lines=source.match(/[^\n]*\n|[^\n]+$/g)||[];
            for(const edit of [...item.changes].reverse())lines.splice(edit.start,edit.end-edit.start,edit.text);
            const result=lines.join('');
            assert.equal(hash(result),item.after,item.path);
            writeFileSync(item.path,result);
          }
          JS
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Commit only checked text edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/coastal-main.jsx src/style.css scripts/verify-ledger-art-deployment.mjs tests/brand-logo.browser.mjs tests/expense-mobile-layering.browser.mjs tests/helpers/ledger-browser.mjs
          git commit -m 'feat(typography): apply GenSen Rounded TW across all rendered UI'
          git push origin HEAD:feat/brand-gensen-rounded-tw
