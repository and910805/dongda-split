name: Apply checked mobile navigation changes
on:
  push:
    branches: [fix/mobile-ledger-switcher-and-actions]
    paths: ['.github/workflows/apply-mobile-navigation-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-ledger-switcher-and-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only baseline and result hash checked edits
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const hash=s=>createHash('sha1').update(`blob ${Buffer.byteLength(s)}\0`).update(s).digest('hex');
          const expected=['src/ProductApp.jsx','src/MobileLedgerOverview.jsx','src/expense-single-modal.css','src/ledger-coastal.css','tests/helpers/ledger-browser.mjs','tests/ledger-brush-summary.browser.mjs','tests/ledger-reference-a.browser.mjs','scripts/verify-ledger-art-deployment.mjs','src/ledger-layout-polish.css'];
          const edits=JSON.parse(readFileSync('.review/mobile-navigation-edits.json','utf8'));
          assert.deepEqual(Object.keys(edits).sort(),expected.sort());
          for(const [path,item] of Object.entries(edits)){
            const before=readFileSync(path,'utf8');assert.equal(hash(before),item.base,`Unexpected baseline: ${path}`);
            const lines=before.match(/[^\n]*\n|[^\n]+$/g)||[];
            for(const [start,end,text] of [...item.edits].reverse())lines.splice(start,end-start,text);
            const after=lines.join('');assert.equal(hash(after),item.result,`Result mismatch: ${path}`);writeFileSync(path,after);
          }
          JS
          git diff --check
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node --test tests/ledger-navigation-polish.browser.mjs
      - name: Commit reviewed source only on this task branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ProductApp.jsx src/MobileLedgerOverview.jsx src/expense-single-modal.css src/ledger-coastal.css src/ledger-layout-polish.css tests/helpers/ledger-browser.mjs tests/ledger-brush-summary.browser.mjs tests/ledger-reference-a.browser.mjs scripts/verify-ledger-art-deployment.mjs
          git commit -m 'fix(ledger): simplify mobile actions and ledger switching'
          git push origin HEAD:fix/mobile-ledger-switcher-and-actions
