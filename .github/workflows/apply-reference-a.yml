name: Apply verified reference A source patch
on:
  push:
    branches: [feat/ledger-reference-a-mobile-polish]
    paths: ['tools/apply-reference-a.py']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'and910805/dongda-split' && github.ref == 'refs/heads/feat/ledger-reference-a-mobile-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact verified source delta
        run: python3 tools/apply-reference-a.py
      - name: Commit only the verified UI source files to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ProductApp.jsx src/ledger-coastal.css
          git commit -m 'feat(ledger): align A layout and contextual actions'
          git push origin HEAD:refs/heads/feat/ledger-reference-a-mobile-polish
