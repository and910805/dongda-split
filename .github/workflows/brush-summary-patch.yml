name: Apply checked summary edit
on:
  push:
    branches: [feat/ledger-brush-summary]
    paths: ['.github/workflows/brush-summary-patch.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'and910805/dongda-split'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ledger-brush-summary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only the reviewed summary replacement
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const file='src/ProductApp.jsx';
          let source=readFileSync(file,'utf8');
          const hash=createHash('sha1').update(`blob ${Buffer.byteLength(source)}\0`).update(source).digest('hex');
          assert.equal(hash,'431b1626656c812aeba119a0387dd9394cac30fd');
          const anchor="import {LedgerExpenseActions} from './LedgerExpenseActions.jsx';";
          assert.equal(source.split(anchor).length,2);
          source=source.replace(anchor,anchor+"\nimport {LedgerBrushSummary} from './LedgerBrushSummary.jsx';");
          const start=source.indexOf('    <div className="mobile-summary-cluster">');
          const end=source.indexOf('    <div className="real-grid">',start);
          assert.ok(start>0&&end>start);
          assert.equal((source.slice(start,end).match(/<article className="stat-card/g)||[]).length,4);
          source=source.slice(0,start)+'    <LedgerBrushSummary name={group.name} memberCount={memberCount} expenseCount={group.expenses.length} settlementCount={group.settlements.length} totalLabel={groupMoney(total)} balanceLabel={groupMoney(Math.abs(mine))} balanceCents={mine} isMember={currentUserIsMember} expenseDates={availableExpenseDates}/>\n'+source.slice(end);
          writeFileSync(file,source);
          const coastal='tests/ledger-coastal.browser.mjs';
          let test=readFileSync(coastal,'utf8');
          assert.ok(test.includes('.real-stats .stat-card'));
          test=test.replaceAll('.real-stats .stat-card','.ledger-brush-metric').replace('length"), 4);','length"), 3);').replace("stats:r('.real-stats')","stats:r('.ledger-brush-metrics')");
          writeFileSync(coastal,test);
          const reference='tests/ledger-reference-a.browser.mjs';
          test=readFileSync(reference,'utf8');
          assert.equal(test.split('.real-stats .stat-card:nth-child(2) h3').length,3);
          writeFileSync(reference,test.replaceAll('.real-stats .stat-card:nth-child(2) h3','[data-summary-metric=total] .ledger-brush-value'));
          const review='.github/workflows/expense-entry-review.yml';
          let workflow=readFileSync(review,'utf8');
          const command='run: node --test tests/ledger-reference-a.browser.mjs tests/ledger-mobile-polish.browser.mjs tests/ledger-header.browser.mjs';
          assert.equal(workflow.split(command).length,2);
          workflow=workflow.replace(command,command+' tests/ledger-brush-summary.browser.mjs').replace("      - 'public/ledger-coast*.webp'","      - 'public/ledger-coast*.webp'\n      - 'public/ledger-summary-*.svg'");
          writeFileSync(review,workflow);
          // XML presentation attributes use kebab-case outside JSX.
          const brush='public/ledger-summary-brush.svg';
          writeFileSync(brush,readFileSync(brush,'utf8').replaceAll('strokeLinecap','stroke-linecap').replaceAll('strokeWidth','stroke-width'));
          JS
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node --test tests/ledger-brush-summary.browser.mjs tests/ledger-coastal.browser.mjs tests/ledger-reference-a.browser.mjs
      - name: Retain allowlisted source for local verification
        run: tar -czf /tmp/brush-summary-source.tar.gz src tests public *.mjs package.json pnpm-lock.yaml pnpm-workspace.yaml index.html server.js Dockerfile
      - uses: actions/upload-artifact@v4
        with:
          name: brush-summary-source
          path: /tmp/brush-summary-source.tar.gz
          retention-days: 1
      - name: Commit only scoped edits and remove this one-use workflow
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/brush-summary-patch.yml
          git add src/ProductApp.jsx tests/ledger-coastal.browser.mjs tests/ledger-reference-a.browser.mjs public/ledger-summary-brush.svg .github/workflows/expense-entry-review.yml
          git commit -m 'feat(ledger): replace summary cards with a painted ribbon and paper note'
          git push origin HEAD:feat/ledger-brush-summary
