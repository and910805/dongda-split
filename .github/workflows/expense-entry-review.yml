name: Expense entry review
on:
  push:
    branches: [feat/expense-responsive-guided-entry]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/ledger-coast.webp'
      - 'public/coastal-*.svg'
      - 'index.html'
      - 'currency.mjs'
      - 'finance.mjs'
      - '.github/workflows/expense-entry-review.yml'
permissions:
  contents: read
concurrency:
  group: expense-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Verify expense modal with the real app navigation
        run: node --test tests/expense-mobile-layering.browser.mjs
        env:
          ENTRY_SCREENSHOTS: output/expense-mobile-layering
      - name: Verify coastal ledger with the full built app
        run: node --test tests/ledger-coastal.browser.mjs
        env:
          COASTAL_SCREENSHOTS: output/ledger-coastal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expense-mobile-layering-screenshots
          path: output/expense-mobile-layering/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-coastal-screenshots
          path: output/ledger-coastal/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: expense-entry-build
          path: dist/
          retention-days: 3
