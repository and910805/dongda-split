name: Expense entry review
on:
  push:
    branches: [feat/expense-responsive-guided-entry]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/expense-entry-review.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Package isolated review workspace
        run: tar --exclude=.git --exclude=output --exclude=.env --exclude='node_modules/.cache' -czf /tmp/expense-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: expense-review-workspace
          path: /tmp/expense-workspace.tgz
          retention-days: 3
