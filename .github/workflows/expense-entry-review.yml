name: Expense entry review
on:
  push:
    branches: [feat/expense-responsive-guided-entry]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'currency.mjs'
      - 'finance.mjs'
      - '.github/workflows/expense-entry-review.yml'
permissions:
  contents: read
concurrency:
  group: expense-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: expense-entry-build
          path: dist/
          retention-days: 3
