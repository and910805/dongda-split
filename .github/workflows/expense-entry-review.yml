name: Expense entry review
on:
  push:
    branches: [feat/expense-responsive-guided-entry]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/ledger-coast*.webp'
      - 'public/ledger-summary-*.svg'
      - 'public/coastal-*.svg'
      - 'public/triptab-*'
      - 'public/fonts/gensen-tw-2.1.0/**'
      - 'index.html'
      - 'currency.mjs'
      - 'finance.mjs'
      - '.github/workflows/expense-entry-review.yml'
permissions:
  contents: read
concurrency:
  group: expense-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Verify rendered GenSen TW fonts and font-only layout invariants
        run: node --test tests/typography.browser.mjs
        env:
          COASTAL_SCREENSHOTS: output/ledger-coastal/gensen
      - name: Verify handwritten branding across all surfaces
        run: node --test tests/brand-logo.browser.mjs
        env:
          BRAND_SCREENSHOTS: output/ledger-coastal/brand
      - name: Verify expense modal with the real app navigation
        run: node --test tests/expense-mobile-layering.browser.mjs
        env:
          ENTRY_SCREENSHOTS: output/expense-mobile-layering
      - name: Verify coastal ledger with the full built app
        run: node --test tests/ledger-coastal.browser.mjs
        env:
          COASTAL_SCREENSHOTS: output/ledger-coastal
      - name: Verify reference A actions and mobile workflows
        run: node --test tests/ledger-reference-a.browser.mjs tests/ledger-mobile-polish.browser.mjs tests/ledger-header.browser.mjs tests/ledger-brush-summary.browser.mjs tests/ledger-layout-polish.browser.mjs
        env:
          COASTAL_SCREENSHOTS: output/ledger-coastal
      - name: Verify mobile ledger switching and direct expense actions
        run: node --test tests/ledger-navigation-polish.browser.mjs
        env:
          COASTAL_SCREENSHOTS: output/ledger-coastal/navigation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expense-mobile-layering-screenshots
          path: output/expense-mobile-layering/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-coastal-screenshots
          path: output/ledger-coastal/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: expense-entry-build
          path: dist/
          retention-days: 3
