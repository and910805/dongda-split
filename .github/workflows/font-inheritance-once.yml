name: Correct checked font inheritance
on:
  push:
    branches: [style/gensen-rounded-tw]
    paths: ['.github/workflows/font-inheritance-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/gensen-rounded-tw
      - name: Correct font-only declarations and test synchronization
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const hashes={
            'src/expense-single-modal.css':'964a4bf2d98c33f1034b91d9e354afd3fdbfac68',
            'src/ledger-coastal.css':'3feb7f736bb51aa11809c5caed5dda5810170781',
            'tests/gensen-font.test.mjs':'2ad871a079c2177596d501ce48ecccee8e9aa275',
            'tests/gensen-font.browser.mjs':'6d994839e455b30b98ba91a9914f6148466cc18a'
          };
          for(const [name,hash] of Object.entries(hashes)){
            const source=readFileSync(name,'utf8');
            assert.equal(createHash('sha1').update(`blob ${Buffer.byteLength(source)}\0`).update(source).digest('hex'),hash,name);
            let next=source;
            if(name.endsWith('.css')){
              const match="font-family:'GenSenRoundedTW',  inherit;";
              assert.equal(source.split(match).length,2);
              next=source.replace(match,'font-family: inherit;');
            }else if(name.endsWith('.test.mjs')){
              const match='    const source=read(`src/${name}`);';
              assert.equal(source.split(match).length,2);
              next=source.replace(match,match+"\n    assert.doesNotMatch(source, /font-family[^;}]*,[^;}]*\\binherit\\b/, 'CSS-wide inherit cannot be a font list item');");
            }else{
              const match="await evaluate(`window.__loadedFonts=false;document.fonts.ready.then(()=>window.__loadedFonts=true);void 0`);";
              assert.equal(source.split(match).length,2);
              next=source.replace(match,"await evaluate(`window.__loadedFonts=false;window.__fontLoadError=null;Promise.all([document.fonts.ready,document.fonts.load('400 16px GenSenRoundedTW','旅帳金額NT$123')]).then(()=>window.__loadedFonts=true).catch(e=>{window.__fontLoadError=String(e);window.__loadedFonts=true});void 0`);");
              next=next.replace("await wait('window.__loadedFonts');","await wait('window.__loadedFonts');\n  assert.equal(await evaluate('window.__fontLoadError'),null);");
            }
            assert.notEqual(next,source,name);writeFileSync(name,next);
          }
          const doc='docs/gensen-rounded-tw.md';
          writeFileSync(doc,readFileSync(doc,'utf8').replace('字型頁：https://font.emtech.cc/fonts/GenSenRoundedTW\n',''));
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/expense-single-modal.css src/ledger-coastal.css tests/gensen-font.test.mjs tests/gensen-font.browser.mjs docs/gensen-rounded-tw.md
          git commit -m 'fix(font): keep inherited controls valid and await sampled glyphs'
          git push origin HEAD:style/gensen-rounded-tw
