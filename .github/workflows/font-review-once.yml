name: Font review inputs
on:
  push:
    branches: [style/gensen-rounded-tw]
    paths: ['.github/workflows/font-review-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect TW regular-weight delivery
        run: |
          curl -fLsS --max-time 40 https://font.emtech.cc/css/GenSenRoundedTW/400 -o /tmp/gensen-400.css
          wc -c /tmp/gensen-400.css
          head -c 3500 /tmp/gensen-400.css
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: font-css-review
          path: /tmp/gensen-400.css
          retention-days: 1
