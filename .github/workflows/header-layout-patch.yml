name: Apply checked header patch
on:
  push:
    branches: [fix/ledger-header-settings]
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'and910805/dongda-split' && github.ref == 'refs/heads/fix/ledger-header-settings'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed edit only to ProductApp
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const file='src/ProductApp.jsx';
          const blob=text=>{const data=Buffer.from(text);return createHash('sha1').update(`blob ${data.length}\0`).update(data).digest('hex')};
          let s=readFileSync(file,'utf8');
          assert.equal(blob(s),'19608b73b5de6c7df27c55f92d03946b46d7b48c','Base file changed; stop without writing');
          const replace=(from,to)=>{assert.equal(s.split(from).length,2,'Patch anchor must occur exactly once');s=s.replace(from,to)};
          replace("import {LedgerExpenseActions} from './LedgerExpenseActions.jsx';", "import {LedgerExpenseActions} from './LedgerExpenseActions.jsx';\nimport './ledger-header.css';");
          replace("  const [initialExpenseKind,setInitialExpenseKind]=useState('expense');", "  // The dashboard owns settings state; the header supplies its desktop location.\n  const [headerSettingsHost,setHeaderSettingsHost]=useState(null);\n  const [initialExpenseKind,setInitialExpenseKind]=useState('expense');");
          replace('          {adminViewing?<span className="admin-view-badge">','          <div className="header-ledger-settings" ref={setHeaderSettingsHost}/>\n          {adminViewing?<span className="admin-view-badge">');
          replace('<GroupDashboard key={group.id} group={group}','<GroupDashboard key={group.id} settingsHost={headerSettingsHost} group={group}');
          replace('function GroupDashboard({group,me,','function GroupDashboard({settingsHost,group,me,');
          const start=s.indexOf('          <details className="group-admin-menu"');
          const end=s.indexOf('          </div></details>',start)+'          </div></details>'.length;
          const wrapper=s.lastIndexOf('<div className="group-overview-side">',start);
          assert.ok(start>0&&end>start&&wrapper>0);
          const menu=s.slice(start,end);
          assert.ok(s.slice(end).startsWith('\n        </div>'));
          s=s.slice(0,wrapper)+s.slice(end+'\n        </div>'.length);
          replace('          <p className="ledger-travel-note">山海相伴，旅途的每一刻，都值得被好好記錄</p>\n','');
          const anchor="  return <main className={`real-dashboard ${refreshing?'is-refreshing':''}`} data-mobile-view={mobileNavActive} aria-busy={refreshing}>\n";
          replace(anchor,anchor+'    {settingsHost && createPortal(\n'+menu+'\n      , settingsHost)}\n');
          assert.equal(blob(s),'431b1626656c812aeba119a0387dd9394cac30fd','Patch output must match the locally checked file');
          writeFileSync(file,s);
          NODE
          git diff --check
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node --test tests/ledger-header.browser.mjs
      - name: Commit only the checked source edit to the task branch
        run: |
          test "$(git diff --name-only)" = 'src/ProductApp.jsx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ProductApp.jsx
          git commit -m 'fix(ledger): move settings between invite and add, remove travel tagline'
          git push origin HEAD:refs/heads/fix/ledger-header-settings
