name: Capture exact mobile review source
on:
  push:
    branches: [fix/mobile-ledger-switcher-and-actions]
    paths: ['.github/workflows/mobile-review-source-once.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c8fafcbebc0e9be64e98bf5311a8f4d7cb382238
          persist-credentials: false
      - name: Archive allowlisted source only
        run: tar -czf /tmp/mobile-review-source.tar.gz src tests public scripts .github/workflows *.mjs package.json pnpm-lock.yaml pnpm-workspace.yaml index.html server.js Dockerfile
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-review-source
          path: /tmp/mobile-review-source.tar.gz
          retention-days: 1
