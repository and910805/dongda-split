name: Prepare checked GenSen TW fonts
on:
  push:
    branches: [feat/brand-gensen-rounded-tw]
    paths: ['.github/workflows/prepare-gensen-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brand-gensen-rounded-tw
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot exact sources without credentials or private data
        run: tar -czf /tmp/gensen-baseline.tar.gz src tests public scripts *.mjs package.json pnpm-lock.yaml pnpm-workspace.yaml index.html server.js Dockerfile .github/workflows
      - uses: actions/upload-artifact@v4
        with:
          name: gensen-baseline
          path: /tmp/gensen-baseline.tar.gz
          retention-days: 1
      - name: Install disposable font preparation tools, not application dependencies
        run: python -m pip install fonttools==4.60.1 brotli==1.1.0
      - name: Generate checksum-verified static webfont shards
        run: python scripts/prepare-gensen-fonts.py
      - name: Commit only generated font resources to this branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fonts/gensen-tw-2.1.0 src/gensen-font-faces.css
          git commit -m 'feat(fonts): package official GenSen Rounded TW with on-demand glyph subsets'
          git push origin HEAD:feat/brand-gensen-rounded-tw
      - name: Package review inputs
        run: tar -czf /tmp/gensen-font-review.tar.gz src tests public scripts *.mjs package.json pnpm-lock.yaml pnpm-workspace.yaml index.html server.js Dockerfile .github/workflows
      - uses: actions/upload-artifact@v4
        with:
          name: gensen-font-review
          path: /tmp/gensen-font-review.tar.gz
          retention-days: 1
