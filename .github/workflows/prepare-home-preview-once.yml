name: Capture genuine homepage expense preview
on:
  push:
    branches: [feat/home-real-expense-preview]
    paths: ['.github/workflows/prepare-home-preview-once.yml']
permissions:
  contents: write
jobs:
  capture:
    if: github.ref == 'refs/heads/feat/home-real-expense-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-real-expense-preview
      - name: Replace only the checked homepage phone markup
        shell: python
        run: |
          from pathlib import Path
          from hashlib import sha1
          p = Path('src/main.jsx')
          data = p.read_bytes()
          assert sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == 'b2297496d9c9234360abd5051d56d961b93d1167'
          t = data.decode()
          t = t.replace("import {BrandLogo as Brand} from './BrandLogo.jsx';", "import {BrandLogo as Brand} from './BrandLogo.jsx';\nimport {HeroLedgerPreview} from './HeroLedgerPreview.jsx';")
          t = t.replace('<div className="hero-visual" role="img" aria-label="旅帳 TripTab 的日本行程 iPhone 分帳畫面預覽">', '<div className="hero-visual hero-ledger-preview">')
          t = t.replace('<div className="ticket"><span>TOKYO · FUJI</span><b>東京富士五日遊</b><small>3 位旅伴 · JPY</small><i aria-hidden="true"></i></div>', '<div className="ticket"><span>TRIP LEDGER</span><b>宜筆勾銷</b><small>15 位旅伴 · TWD</small><i aria-hidden="true"></i></div>')
          start = t.index('            <div className="phone-content">')
          end = t.index('            <span className="home-indicator"', start)
          t = t[:start] + '            <HeroLedgerPreview/>\n' + t[end:]
          t = t.replace('<div className="float-note"><CircleDollarSign/><div><small>已自動簡化轉帳</small><b>只需要轉帳 2 次</b></div></div>', '<div className="float-note"><ReceiptText aria-hidden="true"/><div><small>宜筆勾銷 · 示範資料</small><b>實際支出介面預覽</b></div></div>')
          assert '<HeroLedgerPreview/>' in t
          p.write_text(t)
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/capture-home-ledger-preview.mjs
      - name: Commit only the homepage markup and anonymous capture
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          test -z "$(git diff --name-only -- src/ProductApp.jsx server.js package.json pnpm-lock.yaml)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/main.jsx public/hero-ledger-expenses-v1.webp public/hero-ledger-expenses-v1.json
          git commit -m 'feat(home): show the real expense page in the hero phone'
          git push origin HEAD:feat/home-real-expense-preview
      - uses: actions/upload-artifact@v4
        with:
          name: home-preview-capture
          path: public/hero-ledger-expenses-v1.*
          retention-days: 3
