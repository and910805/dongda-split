<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f9d69" />
    <title>目前無法連線｜旅帳 TripTab</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, "Noto Sans TC", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 32px 20px; background: #fbf8f1; color: #28483b; }
      main { width: min(100%, 420px); text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 18px; background: #ead9bb; font-size: 36px; font-weight: 700; }
      h1 { margin: 0 0 12px; font-size: 26px; }
      p { margin: 0 0 28px; line-height: 1.7; }
      a { display: inline-block; min-height: 48px; padding: 12px 24px; border-radius: 12px; background: #1f9d69; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #28483b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">T</div>
      <h1>目前無法連線</h1>
      <p>旅帳需要網路才能讀取帳本和完成記帳。連線恢復後，請重新開啟帳本。</p>
      <a href="/app">重新開啟旅帳</a>
    </main>
  </body>
</html>
